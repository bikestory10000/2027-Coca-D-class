const grid = document.getElementById('grid');
grid.innerHTML = SETS.map(s => `
  <a class="set-card" href="set${s.n}.html">
    <div class="sc-top"><span class="sc-no">${s.n}</span><span class="sc-cnt">${s.cnt}단어</span></div>
    <div class="sc-range">No. ${s.from} – ${s.to}</div>
    <div class="sc-words"><b>${s.fw}</b> · ${s.sample.split(', ').slice(1).join(' · ')} …</div>
  </a>`).join('');

const q = document.getElementById('q');
const box = document.getElementById('results');
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase();
  if (v.length < 1) { box.classList.remove('show'); box.innerHTML = ''; return; }
  const starts = [], has = [];
  for (const w of WORDS) {
    const lw = w[0].toLowerCase();
    if (lw.startsWith(v)) starts.push(w);
    else if (lw.includes(v) || w[1].includes(v)) has.push(w);
    if (starts.length > 40) break;
  }
  const hits = starts.concat(has).slice(0, 30);
  box.classList.add('show');
  box.innerHTML = hits.length
    ? hits.map(w => {
        const tag = String(w[2]).padStart(2, '0');
        return `<button class="res" type="button" onclick="location.href='set${tag}.html'">
          <span class="res-w">${esc(w[0])}</span>
          <span class="res-m">${esc(w[1])}</span>
          <span class="res-s">Set ${tag}</span></button>`;
      }).join('')
    : '<div class="res-empty">검색 결과가 없습니다.</div>';
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-row')) box.classList.remove('show');
});
